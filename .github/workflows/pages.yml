# Мобильная версия: тесты и публикация на GitHub Pages при каждом изменении в main
name: Мобильная версия

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Тесты расчёта (Python)
        # Тесты интерфейса ПК не нужны: test_storage и test_ballistics работают без tkinter
        run: python -m unittest tests.test_ballistics tests.test_storage tests.test_mobile_export -v
      - name: Тесты расчёта (мобильная версия)
        run: node mobile/tests/ballistics.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@v4
